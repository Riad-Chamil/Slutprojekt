<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exampel</title>
    <link rel="stylesheet" href="../Css och JavaScript/StyleSheet.css" />
  </head>
  <body>
    <header>
      <h1>Idrott och Hälsa</h1>
    </header>

    <nav>
      <a href="../Sidor/Index.html">Hem</a>
      <a href="../Sidor/Boken.html">Boken</a>
      <a href="../Sidor/Matris.html">Matris</a>
      <a href="../Sidor/Skolverket.html">Skolverket</a>
      <a href="../Sidor/Exampel.html">Exampel</a>
    </nav>

    <!--information om sidan-->

    <p class="andra">
      I den här sidan så kommer att hitta ett exampel på en av det viktigaste
      saker man kommer att gå genom unde året och det är om kondition och
      simning
    </p>

    <!--ett div med dens engen styling som jag använde för att göra så att lungorna och knappar är till vänster medans skickameddelande är till höger och det är så att den inte finns för mycket tom plats-->

    <div class="lunga-kontakt">
      <div style="position: relative; display: inline-block">
        <!--bilden av lungorna-->
        <img id="lungs" src="../Bilder/Lungs.png" />

        <!--knappar för att kunna gör lungorna större eller mindre-->
        <div class="buttons">
          <button id="button1" onclick="inhale()">Inhale</button>
          <button id="button2" onclick="exhale()">Exhale</button>
        </div>
      </div>
      <!--JavaScripten som finnns i en annnan fil och den körs här-->
      <script src="../Css och JavaScript/JavaScript.js"></script>
      <div class="SkickaMeddelande2">
        <!--fråga så att man vet vad man ska göra-->
        <h2>Vad skulle jag kunna fixa i mitt hemsida?</h2>
        <!--form för att man ska kunna skicka meddelande. Text rutan som man skriver in i och dens knapp för att skicka det-->
        <form id="SkickaMeddelande">
          <textarea
            id="Meddelande"
            placeholder="Skriv ditt meddelande"
          ></textarea>
          <button type="button" onclick="skicka()">Skicka</button>
        </form>
        <!--resultatet, det som du har skickat allså så att medelande går nånstans-->
        <p id="resultat"></p>
        <!--javascripten som det ta medelandet till och gör det till ett text och tar bort kod möjligheten från den-->
        <script src="../Css och JavaScript/SkickaMeddelande.js"></script>
      </div>
    </div>
    <footer>Skapad av Riad</footer>
  </body>
</html>
